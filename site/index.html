<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Шахматные солянки</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f7fb; color: #162338; font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 48px 20px 72px; }
    h1 { font-size: clamp(28px, 5vw, 42px); line-height: 1.15; margin: 0 0 14px; }
    .intro { color: #52647c; margin-bottom: 32px; }
    h2 { font-size: 20px; margin-bottom: 16px; }
    .mix-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .mix-card { padding: 20px; border-radius: 14px; background: white; border: 1px solid #dee5ef; box-shadow: 0 2px 8px #19243d08; }
    .mix-card a { color: #195fb5; font-weight: 650; text-decoration: none; font-size: 18px; }
    .mix-card a:hover { text-decoration: underline; }
    .filename { display: block; margin-top: 6px; font-size: 13px; color: #6b7890; overflow-wrap: anywhere; }
    .empty { color: #52647c; padding: 18px; border: 1px dashed #c9d5e5; border-radius: 12px; }
    footer { margin-top: 42px; color: #64748b; font-size: 13px; }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>♟ Шахматные солянки</h1>
    <p class="intro">Тематические подборки шахматных задач Lichess. Выбирай солянку и открывай случайные задачи по её настройкам.</p>
    <section aria-labelledby="catalog-title">
      <h2 id="catalog-title">Каталог</h2>
      <!-- MIX_CARDS -->
    </section>
    <footer>Задачи из открытой базы <a href="https://database.lichess.org/#puzzles" target="_blank" rel="noopener noreferrer">Lichess</a>. Статусы проверки задач появятся в следующих обновлениях.</footer>
  </main>
</body>
</html>
