name = "Завлечение и отвлечение"
source = "lichess_db_puzzle.csv.zst"
template = "mix.html"

puzzles_per_click = 10
popularity_min = 70
min_plays = 50

[rating]
min = 1000
max = 1400

[moves]
min = 2
max = 4

[move_weights]
"1" = 20
"2" = 20
"3" = 50
"4" = 30

# Filename placeholders:
# {name}, {rating_min}, {rating_max}, {theme_numbers},
# {moves}, {moves_min}, {moves_max}, {date}, {Y}, {M}, {D}
#
# {moves} = "3" for moves 3-3, or "1-3" for moves 1-3.
# Example:
# filename = "mix2 {date} R{rating_min}-{rating_max} M{moves}.html"
[output]
filename = "mix2 {date} R{rating_min}-{rating_max} M{moves}.html"

[page]
title = "mix2 R{rating_min}-{rating_max} M{moves}"
heading = "Лёха & Папа — шахматная солянка"

[[themes]]
id = "attraction"
name = "Завлечение"
weight = 1.0

[[themes]]
id = "deflection"
name = "Отвлечение"
weight = 1.0
