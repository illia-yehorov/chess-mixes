# Shared defaults for all chess mixes. This file is NOT a mix.
# Each numbered TOML can override any key or nested table field.
name = "Шахматная солянка"
source = "lichess_db_puzzle.csv.zst"
template = "mix.html"

puzzles_per_click = 10
max_puzzles_per_theme = 1000  # Maximum tasks per theme; 0 = unlimited
popularity_min = 70
min_plays = 50

[rating]
min = 1000
max = 1400

[moves]
min = 2
max = 4

[move_weights]
"2" = 20
"3" = 50
"4" = 30

[page]
heading = "Лёха & Папа — шахматная солянка"
