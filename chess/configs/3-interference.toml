name = "Mix 3"
source = "lichess_db_puzzle.csv.zst"
template = "mix.html"

puzzles_per_click = 10
max_puzzles_per_theme = 5000  # Maximum tasks per theme; 0 = unlimited
popularity_min = 70
min_plays = 50

[rating]
min = 1000
max = 1400

[moves]
min = 2
max = 4

[move_weights]
"2" = 30
"3" = 50
"4" = 20
"5" = 10

[output]
filename = "mix3 {date} R{rating_min}-{rating_max} M{moves}.html"

[page]
title = "mix3 R{rating_min}-{rating_max} M{moves}"
heading = "Лёха & Папа — шахматная солянка"

[[themes]]
id = "interference"
name = "Перекрытие"
weight = 1.0
