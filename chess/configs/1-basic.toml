# Keep only values specific to this mix.
[move_weights]
"1" = 10

# Filename placeholders:
# {name}, {rating_min}, {rating_max}, {theme_numbers},
# {moves}, {moves_min}, {moves_max}, {date}, {Y}, {M}, {D}
#
# {moves} = "3" for moves 3-3, or "1-3" for moves 1-3.
# Example:
# filename = "mix1 {date} R{rating_min}-{rating_max} M{moves}.html"
[output]
filename = "mix1 {date} R{rating_min}-{rating_max} M{moves}.html"

[page]
title = "mix1 R{rating_min}-{rating_max} M{moves}"

