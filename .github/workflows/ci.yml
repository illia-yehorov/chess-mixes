name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python tests
        run: python -m unittest discover -s chess/tests -p "test_*.py" -v
      - name: JavaScript tests
        run: node --test chess/tests/mix.test.cjs
      - name: Build static site
        run: python scripts/build_site.py
      - name: Validate generated catalog
        run: python -c "from pathlib import Path; assert '<!-- MIX_CARDS -->' not in Path('_site/index.html').read_text(encoding='utf-8')"
